[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydpi"
version = "0.1.0"
description = "A professional-grade Deep Packet Inspection (DPI) tool in Python."
readme = "README.md"
authors = [
    { name = "Jules", email = "jules@example.com" }
]
requires-python = ">=3.10"
dependencies = [
    "scapy>=2.5.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "structlog>=23.0.0",
    "pydantic>=2.0.0"
]

[project.scripts]
pydpi = "pydpi.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/pydpi"]
